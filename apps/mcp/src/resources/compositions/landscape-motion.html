<!doctype html>
<!-- catalog: [] disabled: [brand-logo-watermark, brand-logo-outro] reason: "generic MCP template" -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #020617; font-family: Inter, system-ui, sans-serif; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: #e0f2fe; background: radial-gradient(circle at 20% 30%, #0e7490, transparent 32%), linear-gradient(135deg, #020617, #111827 55%, #172554); }
      #bar { position: absolute; left: 180px; top: 710px; width: 0; height: 22px; border-radius: 999px; background: #22d3ee; }
      #headline { position: absolute; left: 180px; top: 300px; width: 1100px; font-size: 104px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.95; }
      #panel { position: absolute; right: 180px; top: 260px; width: 420px; height: 560px; border-radius: 44px; border: 2px solid rgba(125, 211, 252, 0.36); background: rgba(15, 23, 42, 0.62); }
    </style>
  </head>
  <body>
    <div id="stage" class="clip" data-composition-id="landscape-motion-template" data-width="1920" data-height="1080" data-start="0" data-duration="6">
      <div id="headline" data-track="1">Landscape motion template</div>
      <div id="bar" data-track="2"></div>
      <div id="panel" data-track="3"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#headline", { x: -90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 0);
      tl.to("#bar", { width: 900, duration: 6, ease: "none" }, 0);
      tl.fromTo("#panel", { x: 90, opacity: 0 }, { x: 0, opacity: 1, duration: 1, ease: "power2.out" }, 0.25);
      window.__timelines["landscape-motion-template"] = tl;
    </script>
  </body>
</html>
