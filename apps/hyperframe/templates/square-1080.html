<!doctype html>
<!--
  square-1080 template — 1:1 (1080x1080) variant.

  Monolithic single-file contract:
    • all CSS + HTML + GSAP timeline + captions JSON inlined
    • gsap.timeline({ paused: true }) registered in the timeline registry
    • times in seconds, deterministic only
    • track-index convention: 0..8 scenes/BG, 97 brand-corner, 98 audio, 99 captions
    • zero data-composition-src
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <link rel="stylesheet" href="lib/theme.css" />
    <link rel="stylesheet" href="lib/easings.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body {
        width: 1080px; height: 1080px; margin: 0; padding: 0;
        background: var(--ink, #060912); overflow: hidden;
        font-family: "Inter", system-ui, sans-serif;
        color: var(--paper, #f4f6fb); -webkit-font-smoothing: antialiased;
      }
      #ep-stage { width: 1080px; height: 1080px; position: relative; overflow: hidden; }

      #brand-corner {
        position: absolute; top: 56px; right: 56px;
        width: 72px; opacity: 0.42; z-index: 60; pointer-events: none;
      }
      #brand-corner svg { display: block; width: 100%; height: auto; fill: var(--paper, #f4f6fb); }

      .scene { opacity: 0; will-change: opacity, transform, filter; }
      .scene-pad {
        width: 100%; height: 100%; padding: 104px 96px 180px;
        box-sizing: border-box; display: flex; flex-direction: column;
        justify-content: center; align-items: center; gap: 28px; text-align: center;
      }
      .label {
        padding: 10px 18px; border: 1.5px solid rgba(255,255,255,0.18);
        border-radius: 999px; background: rgba(255,255,255,0.07);
        color: var(--accent, #34d399); font-family: "JetBrains Mono", monospace;
        font-size: 18px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
      }
      .headline {
        margin: 0; max-width: 820px; font-size: 80px; font-weight: 820;
        line-height: 1.02; letter-spacing: -2.4px;
      }
      .subcopy {
        margin: 0; max-width: 720px; color: var(--muted, #94a3b8);
        font-family: "JetBrains Mono", monospace; font-size: 24px; line-height: 1.35;
      }

      #captions {
        position: absolute; left: 7%; right: 7%; bottom: 72px; height: 96px;
        display: flex; align-items: center; justify-content: center;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 42px; font-weight: 850; line-height: 1.1; letter-spacing: -0.5px;
        color: var(--paper, #f4f6fb);
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95), 0 1px 0 rgba(0, 0, 0, 0.7);
        text-align: center; padding: 0 40px; box-sizing: border-box;
        pointer-events: none; z-index: 50;
      }
      #captions .hf-caption-token {
        opacity: 0.78;
        transition: color 0.06s linear, opacity 0.06s linear, transform 0.06s ease-out;
      }
      #captions .hf-caption-token.--active {
        color: var(--accent, #34d399);
        opacity: 1;
        transform: scale(1.06);
      }
    </style>
  </head>
  <body>
    <div
      id="ep-stage"
      data-composition-id="square-1080-template"
      data-format="square-1080"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1080"
      data-fps="30"
    >
      <div id="brand-corner" class="clip" data-start="0" data-duration="30" data-track-index="97">
        <svg viewBox="0 0 64 64" aria-label="Logo mark"><path d="M8 8h18v18H8zM38 8h18v18H38zM23 38h18v18H23z" /></svg>
      </div>

      <!--
        Author scenes inline here. Keep the focal area centered and avoid tall
        top/bottom text bands; captions reserve the lower strip.
      -->

      <section id="scene-hook" class="scene clip" data-start="0" data-duration="30" data-track-index="4" style="position:absolute; inset:0;">
        <div class="scene-pad">
          <div id="hook-label" class="label">square-1080</div>
          <h1 id="hook-headline" class="headline">1:1 template stub.</h1>
          <p id="hook-subcopy" class="subcopy">Author scenes inline. Keep key content centered.</p>
        </div>
      </section>

      <audio
        id="voiceover"
        class="clip"
        data-start="0"
        data-duration="30"
        data-track-index="98"
        data-volume="1"
        src="assets/voice.mp3"
      ></audio>

      <div id="captions" class="clip" data-start="0" data-duration="30" data-track-index="99"></div>
    </div>

    <script type="application/json" id="captions-data">[]</script>

    <script src="lib/timeline-helpers.js"></script>
    <script src="lib/captions-karaoke.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });

      const captionsData = JSON.parse(
        document.getElementById("captions-data").textContent || "[]",
      );
      if (captionsData.length > 0) {
        window.__hf.karaoke(tl, "#captions", captionsData, {
          maxChars: 28,
          maxTokens: 6,
        });
      }

      tl.set("#scene-hook", { autoAlpha: 0 }, 0);
      tl.to("#scene-hook", { autoAlpha: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.from("#hook-label", { y: -24, opacity: 0, duration: 0.45, ease: "back.out(1.7)" }, 0.2);
      tl.from("#hook-headline", { y: 28, opacity: 0, duration: 0.6, ease: "back.out(1.5)" }, 0.4);
      tl.from("#hook-subcopy", { y: 20, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["square-1080-template"] = tl;
    </script>
  </body>
</html>
