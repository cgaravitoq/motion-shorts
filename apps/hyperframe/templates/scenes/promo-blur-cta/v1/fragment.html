<div class="scene-pad pbc">
  <img class="pbc-bg" src="__BG_IMAGE__" alt="" />
  <div class="pbc-badge">
    <span class="pbc-badge-dot"></span>
    <span class="pbc-badge-label">__BADGE__</span>
  </div>
  <img class="pbc-avatar" src="__AVATAR_IMAGE__" alt="" />
  <div class="pbc-speaker">
    <p class="pbc-speaker-name">__SPEAKER_NAME__</p>
    <p class="pbc-speaker-role">__SPEAKER_ROLE__</p>
  </div>
  <div class="pbc-block">
    <img class="pbc-logo" src="__LOGO_IMAGE__" alt="" />
    <div class="pbc-copy">
      <h2 class="pbc-title">__TITLE__</h2>
      <p class="pbc-body">__BODY__</p>
    </div>
    <div class="pbc-cta"><span class="pbc-cta-label">__CTA__</span></div>
  </div>
</div>
