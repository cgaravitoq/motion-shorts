<div class="scene-pad pin">
  <div class="pin-col">
    <div class="pin-card">
      <img class="pin-photo" src="__PHOTO_IMAGE__" alt="" />
      <div class="pin-badge"><span class="pin-badge-label">__BADGE__</span></div>
      <div class="pin-speaker">
        <p class="pin-speaker-name">__SPEAKER_NAME__</p>
        <p class="pin-speaker-role">__SPEAKER_ROLE__</p>
      </div>
    </div>
    <div class="pin-block">
      <img class="pin-logo" src="__LOGO_IMAGE__" alt="" />
      <div class="pin-copy">
        <h2 class="pin-title">__TITLE__</h2>
        <p class="pin-date">__DATE__</p>
      </div>
    </div>
  </div>
</div>
