<div class="scene-pad cmp">
  <p class="cmp-eyebrow eyebrow">__EYEBROW__</p>
  <h2 class="cmp-title headline">__TITLE__</h2>
  <div class="cmp-grid">
    <section class="cmp-col cmp-col--a">
      <h3 class="cmp-col__title">__LEFT_TITLE__</h3>
      <ul class="cmp-list" data-count="__LEFT_POINTS_COUNT__">
        <!-- repeat:leftPoints -->
        <li class="cmp-point">
          <span class="cmp-point__mark"></span>
          <span class="cmp-point__text">__ITEM_TEXT__</span>
        </li>
        <!-- /repeat:leftPoints -->
      </ul>
    </section>
    <div class="cmp-divider">
      <span class="cmp-divider__vs">VS</span>
    </div>
    <section class="cmp-col cmp-col--b">
      <h3 class="cmp-col__title">__RIGHT_TITLE__</h3>
      <ul class="cmp-list" data-count="__RIGHT_POINTS_COUNT__">
        <!-- repeat:rightPoints -->
        <li class="cmp-point">
          <span class="cmp-point__mark"></span>
          <span class="cmp-point__text">__ITEM_TEXT__</span>
        </li>
        <!-- /repeat:rightPoints -->
      </ul>
    </section>
  </div>
</div>
