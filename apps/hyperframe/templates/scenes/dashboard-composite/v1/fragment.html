<div class="scene-pad dc">
  <p class="dc-eyebrow eyebrow">__EYEBROW__</p>
  <h2 class="dc-title headline">__TITLE__</h2>
  <div class="dc-grid" data-count="__TILES_COUNT__">
    <!-- repeat:tiles -->
    <article class="dc-tile">
      <p class="dc-tile__value">__ITEM_VALUE__</p>
      <p class="dc-tile__label">__ITEM_LABEL__</p>
      <div class="dc-tile__track">
        <span class="dc-tile__fill" style="--pct: __ITEM_PCT__%"></span>
      </div>
      <span class="dc-tile__delta">__ITEM_DELTA__</span>
    </article>
    <!-- /repeat:tiles -->
  </div>
</div>
