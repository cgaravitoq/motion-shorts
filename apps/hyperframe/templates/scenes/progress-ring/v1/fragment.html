<div class="scene-pad pr">
  <p class="pr-eyebrow eyebrow">__EYEBROW__</p>
  <h2 class="pr-title headline">__TITLE__</h2>
  <ul class="pr-row" data-count="__RINGS_COUNT__">
    <!-- repeat:rings -->
    <li class="pr-ring">
      <div class="pr-dial">
        <svg class="pr-svg" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="pr-track" cx="100" cy="100" r="86" />
          <circle class="pr-arc" cx="100" cy="100" r="86" transform="rotate(-90 100 100)" />
        </svg>
        <span class="pr-num" data-value="__ITEM_VALUE__" data-pct="__ITEM_PCT__">__ITEM_VALUE__</span>
      </div>
      <p class="pr-label">__ITEM_LABEL__</p>
    </li>
    <!-- /repeat:rings -->
  </ul>
</div>
