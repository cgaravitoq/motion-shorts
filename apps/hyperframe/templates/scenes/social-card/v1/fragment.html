<div class="scene-pad soc">
  <p class="soc-eyebrow eyebrow">__EYEBROW__</p>
  <h2 class="soc-title headline">__TITLE__</h2>
  <article class="soc-card">
    <header class="soc-card__head">
      <div class="soc-card__avatar">__AVATAR_INITIALS__</div>
      <div class="soc-card__id">
        <p class="soc-card__name">__NAME__</p>
