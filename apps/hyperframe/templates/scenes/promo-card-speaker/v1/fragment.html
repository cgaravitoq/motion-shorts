<div class="scene-pad pcs">
  <div class="pcs-badge">
    <span class="pcs-badge-dot"></span>
    <span class="pcs-badge-label">__BADGE__</span>
  </div>
  <div class="pcs-speaker">
    <p class="pcs-speaker-name">__SPEAKER_NAME__</p>
    <p class="pcs-speaker-role">__SPEAKER_ROLE__</p>
  </div>
  <img class="pcs-photo" src="__PHOTO_IMAGE__" alt="" />
  <div class="pcs-block">
    <img class="pcs-logo" src="__LOGO_IMAGE__" alt="" />

      <p class="pcs-body">__BODY__</p>
    </div>
    <div class="pcs-cta"><span class="pcs-cta-label">__CTA__</span></div>
  </div>
</div>
