<div class="scene-pad dt">
  <p class="dt-eyebrow eyebrow">__EYEBROW__</p>
  <h2 class="dt-title headline">__TITLE__</h2>
  <div class="dt-tree" data-count="__BRANCHES_COUNT__">
    <svg class="dt-wires" viewBox="0 0 912 760" preserveAspectRatio="none" aria-hidden="true">
      <g class="dt-wires__paths"></g>
    </svg>
    <div class="dt-node dt-node--root">
      <span class="dt-node__kind">si</span>
      <p class="dt-node__text">__QUESTION__</p>
    </div>
    <!-- repeat:branches -->
    <div class="dt-branch" data-tone="__ITEM_TONE__">
      <span class="dt-branch__badge">__ITEM_LABEL__</span>
      <div class="dt-node dt-node--result">
        <p class="dt-node__text">__ITEM_RESULT__</p>
      </div>
    </div>
    <!-- /repeat:branches -->
  </div>
</div>
