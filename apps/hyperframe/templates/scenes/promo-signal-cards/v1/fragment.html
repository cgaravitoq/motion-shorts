<div class="scene-pad psc">
  <div class="psc-badge">
    <img class="psc-badge-icon" src="__BADGE_ICON__" alt="" />
    <span class="psc-badge-label">__BADGE__</span>
  </div>
  <div class="psc-block">
    <h2 class="psc-title">__TITLE__</h2>
    <div class="psc-howto">
      <p class="psc-label">__LABEL__</p>
      <p class="psc-body">__BODY__</p>
    </div>
  </div>
  <div class="psc-strip" data-layout-allow-overflow>
    <!-- repeat:items -->
    <div class="psc-card">
      <img class="psc-card-img" src="__CARD_IMAGE__" alt="" />
      <p class="psc-card-label">__ITEM_TEXT__</p>
    </div>
    <!-- /repeat:items -->
  </div>
</div>
