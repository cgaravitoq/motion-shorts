<div class="scene-pad pqt">
  <img class="pqt-bg" src="__BG_IMAGE__" alt="" />
  <div class="pqt-badge">
    <span class="pqt-badge-dot"></span>
    <span class="pqt-badge-label">__BADGE__</span>
  </div>
  <img class="pqt-avatar" src="__AVATAR_IMAGE__" alt="" />
  <div class="pqt-speaker">
    <p class="pqt-speaker-name">__SPEAKER_NAME__</p>
    <p class="pqt-speaker-role">__SPEAKER_ROLE__</p>
  </div>
  <div class="pqt-block">
    <img class="pqt-logo" src="__LOGO_IMAGE__" alt="" />
    <h2 class="pqt-quote">__QUOTE__</h2>
  </div>
</div>
