<div class="scene-pad fl">
  <p class="fl-eyebrow eyebrow">__EYEBROW__</p>
  <h2 class="fl-title headline">__TITLE__</h2>
  <ol class="fl-rail" data-count="__STEPS_COUNT__">
    <span class="fl-spine" aria-hidden="true"></span>
    <!-- repeat:steps -->
    <li class="fl-step">
      <span class="fl-step__badge"></span>
      <div class="fl-step__body">
        <p class="fl-step__label">__ITEM_LABEL__</p>
        <p class="fl-step__detail">__ITEM_DETAIL__</p>
      </div>
    </li>
    <!-- /repeat:steps -->
  </ol>
</div>
