<div class="scene-pad cd">
  <p class="cd-eyebrow eyebrow">__EYEBROW__</p>
  <h2 class="cd-title headline">__TITLE__</h2>
  <div class="cd-window" data-lines="__LINES_COUNT__">
    <div class="cd-window__bar">
      <span class="cd-window__dot"></span>
      <span class="cd-window__dot"></span>
      <span class="cd-window__dot"></span>
      <span class="cd-window__file">__FILENAME__</span>
    </div>
    <div class="cd-window__body">
      <!-- repeat:lines -->
      <div class="cd-line" data-kind="__ITEM_KIND__"><code class="cd-line__text">__ITEM_TEXT__</code></div>
      <!-- /repeat:lines -->
    </div>
  </div>
</div>
