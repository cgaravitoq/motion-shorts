<div class="scene-pad ax">
  <p class="ax-eyebrow eyebrow">__EYEBROW__</p>
  <h2 class="ax-title headline">__TITLE__</h2>
  <figure class="ax-frame" data-count="__CALLOUTS_COUNT__">
    <img class="ax-image" src="__IMAGE__" alt="" />
    <!-- repeat:callouts -->
    <span class="ax-pin" style="left:__ITEM_X__%; top:__ITEM_Y__%">
      <span class="ax-pin__dot"></span>
      <span class="ax-pin__chip">__ITEM_LABEL__</span>
    </span>
    <!-- /repeat:callouts -->
  </figure>
</div>
