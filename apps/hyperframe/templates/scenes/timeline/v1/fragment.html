<div class="scene-pad tln">
  <p class="tln-eyebrow eyebrow">__EYEBROW__</p>
  <h2 class="tln-title headline">__TITLE__</h2>
  <ol class="tln-list" data-count="__EVENTS_COUNT__">
    <span class="tln-rail" aria-hidden="true"></span>
    <!-- repeat:events -->
    <li class="tln-event">
      <span class="tln-event__dot" aria-hidden="true"></span>
      <div class="tln-event__body">
        <p class="tln-event__marker">__ITEM_MARKER__</p>
        <p class="tln-event__text">__ITEM_TEXT__</p>
      </div>
    </li>
    <!-- /repeat:events -->
  </ol>
</div>
