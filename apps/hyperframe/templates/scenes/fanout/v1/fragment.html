<div class="scene-pad fo">
  <p class="fo-eyebrow eyebrow">__EYEBROW__</p>
  <h2 class="fo-title headline">__TITLE__</h2>
  <div class="fo-graph" data-count="__WORKERS_COUNT__">
    <svg class="fo-wires" viewBox="0 0 1560 680" preserveAspectRatio="none" aria-hidden="true">
      <g class="fo-wires__paths"></g>
    </svg>
    <div class="fo-row fo-row--source">
      <div class="fo-node fo-node--source">
        <span class="fo-node__dot" aria-hidden="true"></span>
        <span class="fo-node__label">__SOURCE_LABEL__</span>
      </div>
    </div>
    <div class="fo-row fo-row--workers">
      <!-- repeat:workers -->
      <div class="fo-node fo-node--worker">
        <span class="fo-node__dot" aria-hidden="true"></span>
        <span class="fo-node__label">__ITEM_LABEL__</span>
      </div>
      <!-- /repeat:workers -->
    </div>
    <div class="fo-row fo-row--synth">
      <div class="fo-node fo-node--synth">
        <span class="fo-node__dot" aria-hidden="true"></span>
        <span class="fo-node__label">__SYNTH_LABEL__</span>
      </div>
    </div>
  </div>
</div>
