<div class="scene-pad br">
  <p class="br-eyebrow eyebrow">__EYEBROW__</p>
  <h2 class="br-title headline">__TITLE__</h2>
  <ul class="br-chart" data-count="__BARS_COUNT__">
    <!-- repeat:bars -->
    <li class="br-row">
      <p class="br-label">__ITEM_LABEL__</p>
      <div class="br-track">
        <span class="br-fill" style="--pct: __ITEM_PCT__%"></span>
      </div>
      <p class="br-value">__ITEM_VALUE__</p>
    </li>
    <!-- /repeat:bars -->
  </ul>
</div>
