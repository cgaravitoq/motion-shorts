<div class="scene-pad pdt">
  <div class="pdt-badge">
    <span class="pdt-badge-dot"></span>
    <span class="pdt-badge-label">__BADGE__</span>
  </div>
  <div class="pdt-block">
    <img class="pdt-logo" src="__LOGO_IMAGE__" alt="" />
    <h2 class="pdt-title">__TITLE__</h2>
    <div class="pdt-chips">
      <!-- repeat:chips -->
      <div class="pdt-chip"><p class="pdt-chip-text">__ITEM_TEXT__</p></div>
      <!-- /repeat:chips -->
    </div>
    <div class="pdt-cta"><span class="pdt-cta-label">__CTA__</span></div>
  </div>
</div>
