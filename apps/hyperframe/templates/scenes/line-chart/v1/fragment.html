<div class="scene-pad lc">
  <p class="lc-eyebrow eyebrow">__EYEBROW__</p>
  <h2 class="lc-title headline">__TITLE__</h2>
  <figure class="lc-figure" data-count="__SERIES_COUNT__" data-unit="__UNIT__">
    <svg class="lc-svg" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <g class="lc-grid"></g>
      <g class="lc-ylabels"></g>
      <g class="lc-xlabels"></g>
      <g class="lc-series"></g>
      <g class="lc-dots"></g>
    </svg>
    <ul class="lc-legend">
      <!-- repeat:series -->
      <li class="lc-legend__item">
        <span class="lc-legend__swatch" aria-hidden="true"></span>
        <span class="lc-legend__label">__ITEM_LABEL__</span>
      </li>
      <!-- /repeat:series -->
    </ul>
  </figure>
</div>
