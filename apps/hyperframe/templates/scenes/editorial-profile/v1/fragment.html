<div class="scene-pad edp" style="--editorial-accent: __ACCENT_COLOR__">
  <div class="edp-brand">__BRAND__</div>
  <img class="edp-art" src="__ART_IMAGE__" alt="" data-layout-allow-overflow />
  <div class="edp-kicker">__KICKER__</div>
  <h2 class="edp-name">__NAME__</h2>
  <p class="edp-tagline">__TAGLINE__</p>
  <div class="edp-features edp-features--__FEATURES_COUNT__">
    <!-- repeat:features -->
    <div class="edp-feature">
      <div class="edp-divider"></div>
      <div class="edp-feature-text">__ITEM_TEXT__</div>
    </div>
    <!-- /repeat:features -->
  </div>
  <div class="edp-price">__PRICE__</div>
  <div class="edp-note">__NOTE__</div>
  <div class="edp-counter">__COUNTER__</div>
</div>
