<!doctype html>
<!--
  desktop-1080p template — 16:9 (1920x1080) variant.

  Mirrors the 9:16 monolithic single-file contract (AGENTS.md rule 1):
    • all CSS + HTML + GSAP timeline + captions JSON inlined
    • gsap.timeline({ paused: true }) registered in window.__timelines["<id>"]
    • times in seconds, deterministic only
    • track-index convention: 0..8 scenes/BG, 97 brand-corner, 98 audio, 99 captions
    • zero data-composition-src — the runtime force-applies position:absolute on tracked stage children

  Title-safe / action-safe / YouTube-dead-zone overlay:
    Append `?guides=1` to the dev URL (e.g. http://localhost:3000?guides=1) to
    visualise:
      • title-safe band (inner 80%, ~1536×864) — keep critical text inside
      • action-safe band (inner 90%, ~1728×972) — keep important UI inside
      • YouTube end-screen dead zone (bottom 120 px) — no critical content
      • YouTube CTA/info-card dead zone (bottom-right 160×160 px) — no critical content
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="lib/theme.css" />
    <link rel="stylesheet" href="lib/easings.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body {
        width: 1920px; height: 1080px; margin: 0; padding: 0;
        background: var(--ink, #060912); overflow: hidden;
        font-family: "Inter", system-ui, sans-serif;
        color: var(--paper, #f4f6fb); -webkit-font-smoothing: antialiased;
      }
      #ep-stage { width: 1920px; height: 1080px; position: relative; overflow: hidden; }

      /* Brand corner — visible the whole video. Upper-right per 16:9 conventions. */
      #brand-corner {
        position: absolute; top: 56px; right: 80px;
        width: 96px; opacity: 0.42; z-index: 60; pointer-events: none;
      }
      #brand-corner svg { display: block; width: 100%; height: auto; fill: var(--paper, #f4f6fb); }

      .scene { opacity: 0; will-change: opacity, transform, filter; }
      .scene-pad {
        width: 100%; height: 100%; padding: 96px 160px;
        box-sizing: border-box; display: flex; flex-direction: column;
        justify-content: center; gap: 32px;
      }
      .label {
        align-self: flex-start; padding: 12px 22px;
        border: 1.5px solid rgba(255,255,255,0.18); border-radius: 999px;
        background: rgba(255,255,255,0.07); color: var(--accent, #34d399);
        font-family: "JetBrains Mono", monospace; font-size: 22px;
        font-weight: 700; letter-spacing: 5px; text-transform: uppercase;
      }
      .headline {
        margin: 0; max-width: 1200px; font-size: 96px; font-weight: 800;
        line-height: 1.02; letter-spacing: -3px;
      }
      .subcopy {
        margin: 0; max-width: 1000px; color: var(--muted, #94a3b8);
        font-family: "JetBrains Mono", monospace; font-size: 28px; line-height: 1.4;
      }

      /* Captions strip — desktop-1080p keeps captions inside title-safe.
         Bottom inset is taller than 9:16 so the YouTube end-screen UI
         (bottom 120 px) doesn't occlude them. */
      #captions {
        position: absolute; left: 5%; right: 5%; bottom: 180px; height: 100px;
        display: flex; align-items: center; justify-content: center;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 48px; font-weight: 800; line-height: 1.1; letter-spacing: -0.5px;
        color: var(--paper, #f4f6fb);
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95), 0 1px 0 rgba(0, 0, 0, 0.7);
        text-align: center; padding: 0 64px; box-sizing: border-box;
        pointer-events: none; z-index: 50;
      }
      #captions .hf-caption-token {
        opacity: 0.78;
        transition: color 0.06s linear, opacity 0.06s linear, transform 0.06s ease-out;
      }
      #captions .hf-caption-token.--active {
        color: var(--accent, #34d399);
        opacity: 1;
        transform: scale(1.06);
      }

      /* ── ?guides=1 debug overlay ──────────────────────────────────────
         Title-safe (inner 80% = inset 192/108), action-safe (inner 90% =
         inset 96/54), YouTube end-screen bar (bottom 120 px), YouTube
         CTA/info-card slot (bottom-right 160×160). All non-rendering — the
         overlay is hidden unless `?guides=1` is in the URL. */
      #safe-zone-guides { display: none; position: absolute; inset: 0; z-index: 9999; pointer-events: none; }
      body[data-guides="1"] #safe-zone-guides { display: block; }
      #safe-zone-guides .safe-band {
        position: absolute; border: 2px dashed rgba(52, 211, 153, 0.55);
        box-sizing: border-box;
      }
      #safe-zone-guides .safe-band--title { inset: 108px 192px; }
      #safe-zone-guides .safe-band--action { inset: 54px 96px; border-color: rgba(251, 191, 36, 0.55); }
      #safe-zone-guides .dead-zone {
        position: absolute; background: rgba(239, 68, 68, 0.16);
        border: 2px solid rgba(239, 68, 68, 0.7);
      }
      #safe-zone-guides .dead-zone--endscreen { left: 0; right: 0; bottom: 0; height: 120px; }
      #safe-zone-guides .dead-zone--cta { right: 0; bottom: 0; width: 160px; height: 160px; }
      #safe-zone-guides .safe-label {
        position: absolute; padding: 4px 8px; border-radius: 6px;
        background: rgba(15, 23, 42, 0.85); color: #f4f6fb;
        font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 700;
        letter-spacing: 0.5px; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="ep-stage"
      data-composition-id="desktop-1080p-template"
      data-format="desktop-1080p"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div id="brand-corner" class="clip" data-start="0" data-duration="30" data-track-index="97">
        <svg viewBox="0 0 64 64" aria-label="Logo mark"><path d="M8 8h18v18H8zM38 8h18v18H38zM23 38h18v18H23z" /></svg>
      </div>

      <!--
        Author scenes inline here. Track-index convention:
          0..3   — background layers (mesh / grid / grain / vignette)
          4..6,8 — scenes (track 7 is reserved for #scene-brand-outro)
          97     — #brand-corner (always visible)
          98     — voiceover audio
          99     — captions overlay

        Critical elements (titles, KPIs, CTAs) MUST stay inside title-safe
        (inner 80%). Mark them with data-critical="true" so the desktop-safe
        linter can validate the inset. Avoid the YouTube end-screen bar
        (bottom 120 px) and CTA slot (bottom-right 160×160 px).
      -->

      <section id="scene-hook" class="scene clip" data-start="0" data-duration="30" data-track-index="4" style="position:absolute; inset:0;">
        <div class="scene-pad">
          <div id="hook-label" class="label" data-critical="true">desktop-1080p</div>
          <h1 id="hook-headline" class="headline" data-critical="true">16:9 template stub.</h1>
          <p id="hook-subcopy" class="subcopy">Author scenes inline. Toggle guides with ?guides=1.</p>
        </div>
      </section>

      <audio
        id="voiceover"
        class="clip"
        data-start="0"
        data-duration="30"
        data-track-index="98"
        data-volume="1"
        src="assets/voice.mp3"
      ></audio>

      <div id="captions" class="clip" data-start="0" data-duration="30" data-track-index="99"></div>

      <div id="safe-zone-guides" aria-hidden="true">
        <div class="safe-band safe-band--action"></div>
        <div class="safe-band safe-band--title"></div>
        <div class="dead-zone dead-zone--endscreen"></div>
        <div class="dead-zone dead-zone--cta"></div>
        <span class="safe-label" style="left: 200px; top: 116px;">title-safe 80%</span>
        <span class="safe-label" style="left: 104px; top: 62px;">action-safe 90%</span>
        <span class="safe-label" style="left: 12px; bottom: 128px;">YT end-screen</span>
        <span class="safe-label" style="right: 168px; bottom: 12px;">YT CTA</span>
      </div>
    </div>

    <script type="application/json" id="captions-data">[]</script>

    <script src="lib/timeline-helpers.js"></script>
    <script src="lib/captions-karaoke.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });

      const captionsData = JSON.parse(
        document.getElementById("captions-data").textContent || "[]",
      );
      if (captionsData.length > 0) {
        window.__hf.karaoke(tl, "#captions", captionsData, {
          maxChars: 36,
          maxTokens: 7,
        });
      }

      tl.set("#scene-hook", { autoAlpha: 0 }, 0);
      tl.to("#scene-hook", { autoAlpha: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.from("#hook-label", { x: -42, opacity: 0, duration: 0.45, ease: "back.out(1.7)" }, 0.2);
      tl.from("#hook-headline", { y: 32, opacity: 0, duration: 0.6, ease: "back.out(1.5)" }, 0.4);
      tl.from("#hook-subcopy", { y: 24, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["desktop-1080p-template"] = tl;

      if (new URLSearchParams(window.location.search).get("guides") === "1") {
        document.body.dataset.guides = "1";
      }
    </script>
  </body>
</html>
