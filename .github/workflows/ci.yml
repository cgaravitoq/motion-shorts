name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify Bun version matches packageManager
        run: |
          expected="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          actual="$(bun --version)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Bun version mismatch: package.json packageManager=$expected, runtime=$actual"
            exit 1
          fi
          echo "Bun $actual matches package.json packageManager"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chrome for render tests
        run: bunx puppeteer browsers install chrome

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Env discipline
        run: bun run lint:env

      - name: Catalog reference freshness
        run: bun run catalog:check-generated

      - name: Test
        run: bun run test
