<div class="logo-orbit clip" data-track-index="5">
  <div class="logo-orbit__ring"></div>
  <img class="logo-orbit__mark" src="assets/logo.svg" alt="" />
  <span class="logo-orbit__dot logo-orbit__dot--one"></span>
  <span class="logo-orbit__dot logo-orbit__dot--two"></span>
</div>
<style>
  .logo-orbit {
    position: absolute;
    width: 360px;
    height: 360px;
    display: grid;
    place-items: center;
  }
  .logo-orbit__ring {
    position: absolute;
    inset: 32px;
    border: 1px solid rgb(255 255 255 / 0.24);
    border-radius: 50%;
    box-shadow: 0 0 60px rgb(94 234 212 / 0.18);
  }
  .logo-orbit__mark {
    width: 132px;
    max-height: 132px;
    object-fit: contain;
    filter: drop-shadow(0 18px 30px rgb(0 0 0 / 0.35));
  }
  .logo-orbit__dot {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 999px;
    background: #5eead4;
    box-shadow: 0 0 24px #5eead4;
  }
  .logo-orbit__dot--one {
    transform: translate(126px, -44px);
  }
  .logo-orbit__dot--two {
    transform: translate(-118px, 62px);
    background: #f8d66d;
    box-shadow: 0 0 24px #f8d66d;
  }
</style>
<script>
  tl.from(".logo-orbit__mark", { autoAlpha: 0, scale: 0.82, filter: "blur(12px)", duration: 0.7, ease: "power3.out" }, 0);
  tl.to(".logo-orbit__ring", { rotation: 26, duration: 4.8, ease: "none" }, 0);
  tl.to(".logo-orbit__dot--one", { rotation: 360, transformOrigin: "-126px 44px", duration: 4.8, ease: "none" }, 0);
  tl.to(".logo-orbit__dot--two", { rotation: -360, transformOrigin: "118px -62px", duration: 4.8, ease: "none" }, 0);
</script>
