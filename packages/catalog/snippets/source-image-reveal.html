<div class="source-image-reveal clip" data-track-index="3">
  <img class="source-image-reveal__image" src="assets/source-image.jpg" alt="" />
  <div class="source-image-reveal__mask"></div>
</div>
<style>
  .source-image-reveal {
    position: absolute;
    inset: 180px 72px 260px;
    overflow: hidden;
    border-radius: 8px;
    background: #111827;
  }
  .source-image-reveal__image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    clip-path: inset(0 100% 0 0);
  }
  .source-image-reveal__mask {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.2), transparent);
    transform: translateX(-110%);
  }
</style>
<script>
  tl.to(".source-image-reveal__image", { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power3.out" }, 0);
  tl.to(".source-image-reveal__mask", { x: "220%", duration: 0.9, ease: "power2.inOut" }, 0.05);
</script>
