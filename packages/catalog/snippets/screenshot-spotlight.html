<figure class="screenshot-spotlight clip" data-track-index="4">

</figure>
<style>
  .screenshot-spotlight {
    position: absolute;
    left: 88px;
    right: 88px;
    top: 250px;
    margin: 0;
    overflow: hidden;
    border: 1px solid rgb(255 255 255 / 0.14);
    border-radius: 8px;
    background: #10151f;
    box-shadow: 0 28px 90px rgb(0 0 0 / 0.38);
  }
  .screenshot-spotlight__image {
    display: block;
    width: 100%;
    height: auto;
  }
  .screenshot-spotlight__focus {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--spot-x, 50%) var(--spot-y, 45%), transparent 0 18%, rgb(5 8 12 / 0.72) 35% 100%);

<script>
